[package]
name = "tauri-plugin-wasm-backend"
version = "0.1.0"
license = "Apache-2.0 WITH LLVM-exception"
description = "Run hot-reloadable, capability-restricted WebAssembly backend modules (WIT components or Extism plugins) inside a Tauri app."
edition = "2024"
rust-version = "1.90"
exclude = ["/examples", "/crates", "/dist-js", "/guest-js", "/node_modules", "/tests/fixtures/*/target"]
links = "tauri-plugin-wasm-backend"

[workspace]
# The previous in-repository copy of the core, kept building until the move to
# rust-wasm-core-interchange is confirmed; to be removed in a follow-up.
members = ["crates/wasm-backend-core"]
# The example app is its own workspace.
exclude = ["examples"]

[features]
default = ["component", "extism", "hot-reload"]
# WIT / WebAssembly component model engine (wasmtime).
component = ["wasm-backend-core/component"]
# Extism plugin engine.
extism = ["wasm-backend-core/extism"]
# Watch module files and reload them on change.
hot-reload = ["wasm-backend-core/hot-reload"]
# Derive `specta::Type` on the public models for use with tauri-specta
# (2.0.0-rc.28, which pins specta =2.0.0-rc.28).
specta = ["wasm-backend-core/specta"]

[dependencies]
# Engines, capabilities, registry and hot reload, shared with non-Tauri hosts.
# To go back to the in-repository copy, replace `git` and `rev` with
# `path = "crates/wasm-backend-core"`.
wasm-backend-core = { version = "0.1.0", git = "https://github.com/AJayClauGermany/rust-wasm-core-interchange", rev = "6751777c7d79cca561d55e032ac1c3ccdc98563f", default-features = false }
tauri = { version = "2.12.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
