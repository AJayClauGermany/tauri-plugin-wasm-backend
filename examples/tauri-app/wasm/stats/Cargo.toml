[package]
name = "stats"
version = "0.1.0"
edition = "2024"
publish = false

# An Extism plugin written in Rust. Build with
# `cargo build --release --target wasm32-unknown-unknown`.
[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true

[workspace]
