[package]
name = "wasm-backend-core"
version = "0.1.0"
license = "Apache-2.0 WITH LLVM-exception"
description = "Framework-agnostic core of tauri-plugin-wasm-backend: hot-reloadable, capability-restricted WebAssembly backend modules (WIT components or Extism plugins) for any Rust app."
edition = "2024"
rust-version = "1.90"
# The integration tests use guest fixtures from the repository.
exclude = ["/tests"]

[features]
default = ["component", "extism", "hot-reload"]
# WIT / WebAssembly component model engine (wasmtime).
component = ["dep:wasmtime", "dep:wasmtime-wasi"]
# Extism plugin engine.
extism = ["dep:extism", "dep:wasmtime"]
# Watch module files and reload them on change.
hot-reload = ["dep:notify"]
# Derive `specta::Type` on the public models (specta =2.0.0-rc.28, as pinned
# by tauri-specta 2.0.0-rc.28).
specta = ["dep:specta"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
# Keep in lock-step with the wasmtime version used by `extism` so it is only compiled once.
wasmtime = { version = "49", optional = true, features = ["incremental-cache"] }
wasmtime-wasi = { version = "49", optional = true }
extism = { version = "1.41", optional = true }
notify = { version = "8", optional = true }
specta = { version = "=2.0.0-rc.28", optional = true, features = ["derive"] }
